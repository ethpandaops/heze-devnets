---
buildoor_container_image: "{{ default_tooling_images.buildoor }}"
buildoor_container_pull: true
buildoor_container_networks: "{{ docker_networks_shared }}"

buildoor_jwt_path: /data/execution-auth.secret
buildoor_cl_client: http://beacon:{{ ethereum_node_cl_ports_http_beacon }}
buildoor_el_engine_api: http://execution:{{ ethereum_node_el_ports_engine }}
buildoor_el_rpc: http://execution:{{ ethereum_node_el_ports_http_rpc }}

buildoor_api_port: 8085

buildoor_auth_provider_url: https://auth.{{ network_subdomain }}
buildoor_overview_url: https://buildoor.{{ network_subdomain }}

buildoor_wallet_privkey: "{{ secret_buildoor_wallet_privkey }}"
buildoor_builder_mnemonic: "{{ secret_buildoor_builder_mnemonic }}"
buildoor_builder_mnemonic_index: "{{ builder_index }}"

buildoor_container_command_extra_args:
  - --validator-ranges-url=https://config.{{ network_subdomain }}/api/v1/nodes/validator-ranges
  - --lifecycle
  - --slot-result-retention-epochs=1600
  - --slot-artifact-retention-epochs=1600
buildoor_container_env:
  VIRTUAL_HOST: api-{{ server_fqdn }}
  VIRTUAL_PORT: "{{ buildoor_api_port | string }}"
  LETSENCRYPT_HOST: api-{{ server_fqdn }}
  BUILDOOR_INJECT_HEAD_HTML: <script src="https://pandamenu.ethpandaops.io/panda-menu-1.0.1.js"
    integrity="sha384-icGX6g6CzB0tqlhDc6Su4c6IPVbcbUvfM3xjbbFYsYBwuZR79WkmOxDhGEPfmyn2" crossorigin="anonymous"></script>

lodestar_container_command_extra_args: >-
  {{ lodestar_container_command_extra_simple_args
     + ['--emitPayloadAttributes', '--subscribeAllSubnets'] }}
nethermind_container_command_extra_args: >-
  {{ nethermind_container_command_extra_simple_args
     + ['--Blocks.MinGasPrice=10000000000'] }}
teku_container_command_extra_args: >-
  {{ teku_container_command_extra_simple_args
     + ['--Xfork-choice-updated-always-send-payload-attributes=true', '--p2p-subscribe-all-subnets-enabled'] }}
